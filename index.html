<!DOCTYPE html>
<html lang="uk" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нотатки</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <div class="container my-4">
    <div class="app-window p-4">
      
      <div class="d-flex justify-content-end mb-4">
        <button id="logout-btn" class="btn btn-outline-danger d-flex align-items-center gap-2 rounded-5 px-3 py-2 fw-bold">
        <i class="bi bi-box-arrow-right fs-5">Вийти</i> 
      </button>
        <div class="theme-switch-wrapper">
          <div id="theme-toggle" class="theme-toggle-btn">
            <div class="theme-icon-card">
              <div class="icon-side side-sun">
                <span class="material-icons-round text-warning">light_mode</span>
              </div>
              <div class="icon-side side-moon">
                <span class="material-icons-round text-info">dark_mode</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex gap-3 mb-4">
        <button id="tab-notes" class="btn btn-outline-primary active">Нотатки</button>
        <button id="tab-trash" class="btn btn-outline-danger">Кошик</button>
        <button id="empty-trash-btn" class="btn btn-danger ms-auto d-none">Очистити кошик</button>
      </div>
      
      <div id="notes-grid" class="row row-cols-4"></div>
      <div id="trash-grid" class="notes-grid-container d-none"></div>

      
      
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 24px; background-color: #fff9f3;">
        <input type="datetime-local" id="modal-reminder-input" class="form-control rounded-4 p-3 border-0 bg-light">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" style="color: #111;">Редагувать нотатку</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <div class="modal-body py-3">
          <div class="mb-3">
            <label for="modal-title-input" class="form-label small fw-bold text-muted">Заголовок</label>
            <input type="text" id="modal-title-input" class="form-control rounded-4 p-3 border-0 bg-light" placeholder="Введіть назву...">
          </div>
          <div class="mb-3">
            <label for="modal-textarea-input" class="form-label small fw-bold text-muted">Текст нотатки</label>
            <textarea id="modal-textarea-input" class="form-control rounded-4 p-3 border-0 bg-light" rows="8" placeholder="Почніть писати тут..."></textarea>
          </div>
        </div>
        
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-light rounded-5 px-4" data-bs-dismiss="modal">Скасувати</button>
          <button type="button" id="save-modal-btn" class="btn text-white rounded-5 px-4" style="background: linear-gradient(135deg, #4facfe, #f355da);">Зберегти</button>
          <label for="modal-reminder-input" class="form-label small fw-bold text-muted">Час нагадування (email)</label>
          
        </div>
  
      </div>
    </div>
  </div>

  <button id="add-btn" class="add-note-btn" title="Додати нотатку">
    <span class="material-icons-round">add</span>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script type="text/javascript">
    (function() {
       // Замініть YOUR_PUBLIC_KEY на ключ, який ви взяли в налаштуваннях Account
       emailjs.init("GPPKHY6ih-Lbi6QHQ");
    })();
 </script>
</body>
</html>
