<!DOCTYPE html>
<html lang="uk" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нотатки</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="container my-4">
    
    <div id="auth-block" class="app-window p-4 mx-auto" style="max-width: 420px; min-height: auto;">
        <h3 id="auth-title" class="text-center fw-bold mb-4">Вхід у систему</h3>
        
        <form id="auth-form" class="needs-validation" novalidate>
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Електронна пошта</label>
            <input type="email" id="auth-email" class="form-control p-3" placeholder="name@example.com" required>
            <div class="invalid-feedback">Введіть коректну email-адресу.</div>
          </div>
          
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Пароль</label>
            <input type="password" id="auth-password" class="form-control p-3" placeholder="Мінімум 6 символів" required minlength="6">
            <div class="invalid-feedback">Пароль має бути не менше 6 символів.</div>
          </div>
      
          <div class="mb-4 d-none" id="confirm-password-container">
            <label class="form-label small fw-bold text-muted">Підтвердження пароля</label>
            <input type="password" id="auth-confirm-password" class="form-control p-3" placeholder="Повторіть пароль">
            <div class="invalid-feedback">Паролі не співпадають.</div>
          </div>
          
          <button type="submit" id="auth-submit-btn" class="btn w-100 rounded-5 p-3 fw-bold">Увійти</button>
        </form>
        
        <div class="text-center mt-3">
          <a href="#" id="auth-toggle-mode" class="text-decoration-none fw-bold" style="color: #f355da;">
            Немає аккаунту? Зареєструватися
          </a>
        </div>
      </div>
 </div>
</body>
